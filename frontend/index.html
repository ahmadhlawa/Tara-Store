<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- First-paint title only. The storefront replaces it from StoreSettings once
         the instance's settings load, and the admin workspace sets its own — so this
         is the one place the client name is hard-coded, and it stays a plain name
         with no unverified claim attached. -->
    <title>Tara Store</title>
    <!-- A generic bag glyph in the brand colours, not a copy of the logo: the
         logo is a wordmark and is illegible at 32 px. StoreSettings' favicon_url
         replaces this whenever the owner uploads one. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23484397'/%3E%3Cpath d='M10 11h12l-1.4 10.5a1.6 1.6 0 0 1-1.6 1.4h-6a1.6 1.6 0 0 1-1.6-1.4Z' fill='none' stroke='%23FFC50A' stroke-width='1.8'/%3E%3Cpath d='M13 13V10a3 3 0 0 1 6 0v3' fill='none' stroke='%23FFC50A' stroke-width='1.8'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#484397" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet" />
  </head>
