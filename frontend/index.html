<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- First-paint title only. The storefront replaces it from StoreSettings once
         the instance's settings load, and the admin workspace sets its own — so this
         is the one place the client name is hard-coded, and it stays a plain name
         with no unverified claim attached. -->
    <title>Tara Store</title>
    <!-- The client's supplied favicon, served from public/branding/ and used
         unedited. StoreSettings' favicon_url still replaces it whenever the
         owner uploads one. -->
    <link rel="icon" type="image/png" href="/branding/tara-favicon.png" />
    <link rel="apple-touch-icon" href="/branding/tara-favicon.png" />
    <meta name="theme-color" content="#7F568F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
